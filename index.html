<style>
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1d1a16;--paper:#fffaf0;--red:#e63946;--red-dk:#9d1c26;--yel:#ffd23f;--grn:#2a9d6f;--grn-dk:#17573d;--night:#20352b;
  --disp:'Dela Gothic One','Hiragino Sans','Yu Gothic',sans-serif;
}
html{background:var(--night);touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%;color:var(--paper);font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif;-webkit-tap-highlight-color:transparent;word-break:auto-phrase;line-break:strict;overflow-wrap:anywhere}
body{overflow:hidden;background:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,canvas{touch-action:manipulation}
#gl{touch-action:none}
button{font-family:inherit;color:inherit;font-size:inherit;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--yel);outline-offset:3px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
#fx{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
#vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 95% at 50% 50%,transparent 60%,rgba(15,20,12,.45) 100%)}

.view{position:fixed;inset:0;z-index:10;height:100svh;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:max(58px,calc(env(safe-area-inset-top) + 52px)) 16px max(18px,calc(env(safe-area-inset-bottom) + 12px))}
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:18px;letter-spacing:.04em;border:3px solid var(--ink);border-radius:16px;min-height:54px;padding:0 20px;cursor:pointer;width:100%;
  background:var(--paper);color:var(--ink);box-shadow:0 5px 0 var(--ink);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn svg{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.btn.red{background:var(--red);color:#fff;font-size:21px;min-height:62px;text-shadow:0 2px 0 var(--red-dk)}
.btn.yel{background:var(--yel)}
.btn.ghost{background:rgba(29,26,22,.72);color:var(--paper);border-color:rgba(255,250,240,.55);box-shadow:none;font-size:16px;min-height:48px}
.row{display:flex;gap:10px;width:100%}
.row>.btn{flex:1;min-width:0}

#corner{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));z-index:40;display:flex;gap:8px}
#corner button{height:40px;min-width:44px;padding:0 10px;border-radius:12px;border:2px solid rgba(255,250,240,.5);background:rgba(29,26,22,.7);font-weight:900;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#corner svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* タイトル */
#vTitle{justify-content:space-between;gap:10px;pointer-events:none}
#vTitle button{pointer-events:auto}
.logo{text-align:center;line-height:1;position:relative;width:min(560px,100%);z-index:0}
.logo::before{content:'';position:absolute;inset:-22% -12%;z-index:-1;background:radial-gradient(closest-side,rgba(20,30,22,.82),rgba(20,30,22,0));pointer-events:none}
.logo .en{display:inline-block;font-family:var(--disp);font-size:clamp(13px,3.6vw,18px);letter-spacing:.12em;color:var(--ink);background:var(--yel);padding:5px 12px 4px;border:3px solid var(--ink);transform:rotate(-3deg);box-shadow:3px 3px 0 var(--ink)}
.logo .main{display:block;margin-top:10px;font-family:var(--disp);font-size:min(13vw,7.6vh,76px);color:#fff;letter-spacing:.01em;
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink),0 0 26px rgba(255,210,63,.45)}
.logo .main b{color:var(--yel);font-weight:400}
html[lang=ja] .logo .main{font-family:"Zen Maru Gothic",var(--disp);font-weight:900;letter-spacing:.04em}
html[lang=ja] .logo .main b{font-family:var(--disp);font-weight:400}
html[lang=ja] .rank,html[lang=ja] .stamp,html[lang=ja] .sNum b{font-family:"Zen Maru Gothic",var(--disp);font-weight:900}
.tBottom{width:min(520px,100%);display:flex;flex-direction:column;gap:10px}
.mc{display:flex;gap:10px;align-items:flex-start;width:100%}
.mc .face{flex:none;width:46px;height:46px}
.bubble{position:relative;flex:1;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:9px 12px;font-weight:700;font-size:14px;line-height:1.55}
.bubble small{display:block;font-size:11px;color:var(--red-dk);font-weight:900}
.bubble::before{content:"";position:absolute;left:-11px;top:14px;border:8px solid transparent;border-right-color:var(--ink);border-left:0}

/* 遊び方 */
#vHow{justify-content:center;gap:14px}
.panel{width:min(560px,100%);background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:16px 16px 14px;box-shadow:0 6px 0 var(--ink);min-height:0;overflow:hidden}
.panel h2{font-family:var(--disp);font-weight:400;font-size:22px;text-align:center;margin-bottom:10px}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;gap:10px;align-items:center;font-weight:700;font-size:14px;line-height:1.45}
.step svg{flex:none;width:46px;height:46px;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:5px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.step b{color:var(--red-dk)}
#vHow .btn{width:min(560px,100%)}

/* プレイ（ゲージは置かない） */
#vPlay{padding:0;pointer-events:none}
.hudTop{position:absolute;left:0;right:0;top:0;padding:max(8px,env(safe-area-inset-top)) 112px 0 max(10px,env(safe-area-inset-left));display:flex;gap:8px;align-items:flex-start}
.stChip{flex:none;display:flex;align-items:center;gap:10px;background:rgba(29,26,22,.74);color:var(--paper);border:2px solid rgba(255,250,240,.45);border-radius:12px;padding:5px 10px}
.stChip span{display:flex;align-items:center;gap:4px}
.stChip b{font-family:var(--disp);font-weight:400;font-size:18px;line-height:1}
.stChip svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.stChip .pop{animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(1.6)}to{transform:scale(1)}}
.hint{position:absolute;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 50px);transform:translateX(-50%);max-width:calc(100% - 24px);background:var(--yel);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:8px 14px;font-weight:900;font-size:16px;text-align:center;white-space:nowrap;animation:bob .6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translate(-50%,-5px)}}
#finger{position:absolute;left:0;top:0;width:54px;height:54px;pointer-events:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
#finger svg{width:100%;height:100%}

/* 演出文字（3D の上） */
.ono{position:absolute;left:0;top:0;font-family:var(--disp);white-space:nowrap;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);will-change:transform,opacity}
.ono.red{color:var(--red)}.ono.yel{color:var(--yel)}.ono.blue{color:#8fd3ff}.ono.grn{color:#9be36d}
.sb{position:absolute;left:0;top:0;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:4px 10px;font-weight:900;font-size:15px;white-space:nowrap;will-change:transform,opacity}
.sb::after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-7px;border:7px solid transparent;border-top-color:var(--ink);border-bottom:0}
.sb.hot{background:var(--red);color:#fff;font-size:19px}
.sb.warm{background:#ffe08a}
.sb.mgr{background:var(--ink);color:var(--yel);border-color:var(--yel)}

/* 結果 */
#vResult{justify-content:center;padding-top:max(56px,calc(env(safe-area-inset-top) + 50px))}
.res{width:min(520px,100%);max-height:100%;min-height:0;display:flex;flex-direction:column;gap:8px;align-items:center}
.resCard{position:relative;width:100%;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:20px;box-shadow:0 7px 0 var(--ink);padding:12px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:0;overflow:hidden}
.resTop{display:flex;gap:12px;align-items:center;width:100%}
#rPhoto{flex:none;width:clamp(84px,26vw,132px);height:clamp(84px,26vw,132px);border:3px solid var(--ink);border-radius:14px;background:#ddd}
.resNum{flex:1;min-width:0;text-align:center;padding-right:76px}
.resNum small{display:block;font-size:13px;font-weight:900}
.resNum .pt{font-family:var(--disp);font-size:clamp(34px,10.5vw,72px);line-height:1;color:var(--red);white-space:nowrap}
.rank{font-family:var(--disp);font-size:clamp(18px,5.4vw,24px);text-align:center;line-height:1.25}
.stamp{position:absolute;right:8px;top:8px;width:80px;height:80px;border:5px solid var(--red);color:var(--red);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:15px;line-height:1.1;text-align:center;transform:rotate(-14deg) scale(0);opacity:0;background:rgba(255,250,240,.88)}
.stamp.on{animation:slam .35s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes slam{0%{transform:rotate(-14deg) scale(2.6);opacity:0}100%{transform:rotate(-14deg) scale(1);opacity:1}}
.sNum{display:flex;gap:6px;width:100%}
.sNum div{flex:1;border:2px solid var(--ink);border-radius:10px;padding:4px 2px;text-align:center;font-size:11px;font-weight:900;line-height:1.3;background:#fff;min-width:0}
.sNum div b{display:block;font-family:var(--disp);font-weight:400;font-size:20px}
.dmg{width:100%;text-align:center;font-size:12px;font-weight:900;color:var(--red-dk);line-height:1.4}
.reveal{opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s}
.reveal.on{opacity:1;transform:none}
.res .row .btn{min-height:50px;font-size:16px;padding:0 10px;white-space:nowrap}
#rBtns1 #bAgain{flex:1.7}
.btn.xpost{background:#000;color:#fff}
.btn svg.xlogo{fill:currentColor;stroke:none;width:20px;height:20px}
.resSide{width:100%;display:flex;flex-direction:column;gap:8px}

@media (max-height:700px){
  .logo .main{font-size:min(12vw,6.8vh,62px)}
  .bubble{font-size:13px;padding:7px 10px;line-height:1.45}
  .btn{min-height:48px;font-size:16px}.btn.red{min-height:54px;font-size:19px}
  .step{font-size:13px}.step svg{width:40px;height:40px}
  .resNum .pt{font-size:min(50px,10.5vw)}#rPhoto{width:84px;height:84px}.resCard{gap:4px;padding:10px 12px}
}
@media (max-height:560px) and (orientation:landscape){
  .view{padding-top:max(10px,env(safe-area-inset-top));padding-bottom:max(10px,env(safe-area-inset-bottom))}
  #vTitle{flex-direction:row;align-items:flex-end;justify-content:space-between;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  #vTitle .logo{width:44%;text-align:left;align-self:flex-start;margin-top:4px}
  .logo .main{font-size:min(6.6vw,13vh,58px)}
  .tBottom{width:min(380px,48%)}
  .mc .face{display:none}.bubble::before{display:none}
  #vHow{padding-top:max(52px,env(safe-area-inset-top))}
  .panel{padding:10px 14px}.panel h2{font-size:18px;margin-bottom:6px}
  .step{font-size:12.5px}.step svg{width:34px;height:34px}.steps{gap:6px}
  #vResult{padding-top:max(10px,env(safe-area-inset-top))}
  .res{width:min(760px,100%);flex-direction:row;align-items:stretch;gap:12px}
  .resCard{flex:1.3;padding:8px 12px;gap:4px}
  .resSide{flex:1;justify-content:flex-end;min-width:0}
  .res .row .btn{font-size:14px;gap:6px;padding:0 8px}
  .res .row .btn svg{width:18px;height:18px}
  #rPhoto{width:76px;height:76px}.resNum .pt{font-size:48px}
  .stamp{width:70px;height:70px;font-size:13px}
  .hint{top:auto;bottom:max(10px,env(safe-area-inset-bottom))}
}
#boot-err{position:fixed;inset:auto 8px 8px 8px;z-index:99;background:#fff;color:#b00;font:12px/1.4 monospace;white-space:pre-wrap;padding:10px;border-radius:8px}
#loading{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:50;font-size:12px;font-weight:900;color:rgba(255,250,240,.75);pointer-events:none}
</style>

<div id="fx"></div>
